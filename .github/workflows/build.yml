name: Compile LSPosed Module
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Generate Clean Project Structure
        run: |
          rm -rf app settings.gradle
          mkdir -p app/libs
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/java/com/binit/luigicamerafix
          
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          include ':app'
          EOF
          
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application' version '8.2.2'
          }
          android {
              namespace 'com.binit.luigicamerafix'
              compileSdk 34
              defaultConfig {
                  applicationId "com.binit.luigicamerafix"
                  minSdk 28
                  targetSdk 34
                  versionCode 6
                  versionName "6.0-UltimateShield"
              }
          }
          dependencies {
              compileOnly files('libs/api-82.jar')
          }
          EOF
          
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="Luigi Camera Fix">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Ultimate Shield: Blanket exception suppression for all metadata tags." />
                  <meta-data android:name="xposedminversion" android:value="82" />
              </application>
          </manifest>
          EOF
          
          cat << 'EOF' > app/src/main/assets/xposed_init
          com.binit.luigicamerafix.CameraHook
          EOF
          
          cat << 'EOF' > app/src/main/java/com/binit/luigicamerafix/CameraHook.java
          package com.binit.luigicamerafix;

          import java.lang.reflect.Method;
          import java.lang.reflect.Modifier;
          
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage.LoadPackageParam;

          public class CameraHook implements IXposedHookLoadPackage {
              @Override
              public void handleLoadPackage(LoadPackageParam lpparam) throws Throwable {
                  if (!lpparam.packageName.equals("com.oplus.camera")) return;

                  // 1. The Ultimate Shield: Hook ALL methods in CameraMetadataNative
                  try {
                      Class<?> cameraMetadataNative = XposedHelpers.findClass("android.hardware.camera2.impl.CameraMetadataNative", lpparam.classLoader);
                      XC_MethodHook universalShield = new XC_MethodHook() {
                          @Override
                          protected void afterHookedMethod(MethodHookParam param) throws Throwable {
                              if (param.hasThrowable() && param.getThrowable() instanceof IllegalArgumentException) {
                                  param.setThrowable(null); // Obliterate the crash exception
                                  
                                  // Safely cast to Method to fetch the return type
                                  if (param.method instanceof Method) {
                                      Class<?> returnType = ((Method) param.method).getReturnType();
                                      if (returnType == int.class || returnType == Integer.class) {
                                          param.setResult(0);
                                      } else if (returnType == void.class) {
                                          param.setResult(null);
                                      } else if (returnType == boolean.class || returnType == Boolean.class) {
                                          param.setResult(false);
                                          } else if (returnType == String.class) {
                                              param.setResult("");
                                          } else if (returnType == byte.class || returnType == Byte.class) {
                                              param.setResult((byte)0);
                                          } else if (returnType == byte[].class) {
                                              param.setResult(new byte[0]);
                                          } else if (returnType == int[].class) {
                                              param.setResult(new int[0]);
                                          } else {
                                              param.setResult(null);
                                          }
                                      } else {
                                          param.setResult(null);
                                      }
                                  }
                              }
                          };

                      // Apply the shield to every single declared method in the class
                      for (Method method : cameraMetadataNative.getDeclaredMethods()) {
                          if (!Modifier.isAbstract(method.getModifiers())) {
                              XposedBridge.hookMethod(method, universalShield);
                          }
                      }
                  } catch (Throwable t) { }

                  // 2. Video Fix (Bypass Nokia OZO Audio Codec crash)
                  try {
                      Class<?> mediaCodecClass = XposedHelpers.findClass("android.media.MediaCodec", lpparam.classLoader);
                      XC_MethodHook audioHook = new XC_MethodHook() {
                          @Override
                          protected void beforeHookedMethod(MethodHookParam param) throws Throwable {
                              if (param.args != null && param.args.length > 0 && param.args[0] instanceof String) {
                                  String codecType = (String) param.args[0];
                                  if (codecType.contains("ozoaudio")) {
                                      param.args[0] = "audio/mp4a-latm"; // Redirect to standard AAC
                                  }
                              }
                          }
                      };
                      XposedBridge.hookAllMethods(mediaCodecClass, "createEncoderByType", audioHook);
                      XposedBridge.hookAllMethods(mediaCodecClass, "createByCodecName", audioHook);
                  } catch (Throwable t) { }
              }
          }
          EOF

      - name: Download Xposed API
        run: wget https://github.com/MALTF/XposedBridgeAPI/releases/download/v82/api-82.jar -O app/libs/api-82.jar

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LuigiCameraFix-ReadyToInstall
          path: app/build/outputs/apk/debug/app-debug.apk
          
